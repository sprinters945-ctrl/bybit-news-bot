name: Bybit News Bot

on:
  schedule:
    - cron: '*/10 * * * *'   # har 10 minute try karega (GitHub queue ki wajah se kabhi thoda late bhi ho sakta hai)
  workflow_dispatch: {}       # Actions tab se manually bhi chala sakte ho (test ke liye)

permissions:
  contents: write             # seen_announcements.json commit back karne ke liye zaroori

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run bot (single check)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bybit_news_bot.py

      - name: Save seen-messages state
        run: |
          if [ -f seen_messages.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen_messages.json
            git diff --staged --quiet || git commit -m "update seen messages"
            git push
          else
            echo "seen_messages.json abhi bani nahi (koi post successful nahi hui) — skip commit"
          fi
